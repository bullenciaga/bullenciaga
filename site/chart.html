<style>
  :root{
    --gold:#c7a869;
    /* Aligned with refer.html and thedrop.html -- the chart is one tap from
       the drop page now, so the two sit side by side in a real journey. */
    --gold-light:#e8d9ae;
    --white:#f5f3ee;
    --black:#050505;
    --line: rgba(199,168,105,0.16);
    --listed:#35d07f;
    --down:#b1483f;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0;
    background:var(--black);
    color:var(--white);
    font-family:'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-font-smoothing:antialiased;
    /* The page is a single screen that should not scroll on desktop; on a
       phone the controls wrap and a little scroll is fine. */
    display:flex;
    flex-direction:column;
    padding:clamp(14px, 2.2vw, 34px);
    padding-top:calc(clamp(14px, 2.2vw, 34px) + env(safe-area-inset-top, 0px));
    padding-bottom:calc(clamp(14px, 2.2vw, 34px) + env(safe-area-inset-bottom, 0px));
    gap:clamp(10px, 1.4vw, 20px);
  }

  a{ color:var(--gold); }

  /* ---------------------------------------------------------------- head */
  .head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .head-left{ min-width:0; }
  .price-row{ display:flex; align-items:baseline; gap:clamp(10px, 1.2vw, 20px); flex-wrap:wrap; }
  .price{
    font-size:clamp(30px, 4.4vw, 68px);
    line-height:1;
    color:var(--gold-light);
    letter-spacing:0.01em;
  }
  /* vertical-align:sub extends the line BOX below the baseline, so the header
     grew taller whenever a sub-penny price was shown and shrank again on the
     market cap view -- and since the plot takes the remaining height, the
     whole line jumped on every PRICE/MCAP toggle.
     Offset with position instead: `top` on a relatively positioned element is
     a paint-time nudge and contributes nothing to layout. line-height:0 stops
     the smaller font from participating in the line box at all. */
  /* NOT SCOPED TO .price -- IT MUST APPLY WHEREVER fmtPrice() OUTPUT LANDS.
     fmtPrice returns markup: "$0.0<span class="price-sub">4</span>6106", where
     the span is the COUNT OF ZEROS, not a digit of the number. Scoped to the
     header, the hover readout and the compare readout inserted that span
     unstyled, so the count rendered as an ordinary digit and $0.00006106 was
     displayed as "$0.046106" -- an order of magnitude out, and reading as a
     fall while the line rose. Everything here is in em, so it scales to
     whatever it is dropped into. */
  .price-sub{
    font-size:0.58em;
    letter-spacing:0;
    display:inline-block;
    line-height:0;
    vertical-align:baseline;
    position:relative;
    top:0.2em;
  }
  .change{
    font-size:clamp(13px, 1.4vw, 22px);
    letter-spacing:0.04em;
  }
  .change.up{ color:var(--listed); }
  .change.down{ color:var(--down); }
  .sub{
    margin-top:clamp(5px, 0.7vw, 10px);
    font-size:clamp(10px, 0.95vw, 15px);
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:rgba(245,243,238,0.42);
  }

  /* ------------------------------------------------------------ controls */
  .controls{
    display:flex;
    align-items:center;
    gap:clamp(6px, 0.7vw, 12px);
    flex-wrap:wrap;
  }
  .group{ display:flex; gap:clamp(4px, 0.45vw, 8px); }
  .group.right{ margin-left:auto; }
  /* ONE TIMING SYSTEM. Every duration and curve on the page comes from here,
     so a change to the feel is a change in one place and nothing can drift
     out of step with anything else.

     The cascade on a toggle, in order:
       press   the button you pressed answers first, on its own
       chart   the line morphs, the longest movement and the main content
       row     the comparison buttons arrive last, after the press has landed

     Order is enforced by an actual paint boundary, not by delays -- see
     staggerIn. Delays alone did not work: render() rebuilds the whole SVG in
     the same synchronous task as the class change, so nothing painted until
     all of it was done and every delay was measured from that same moment. */
  /* WHAT MOVES AND WHAT DOES NOT.
     Continuous things animate. Discrete things snap.
     The chart line is a quantity changing into another quantity, so it
     morphs. The headline is the same, so it rolls. Which buttons exist and
     which one is lit is neither -- it is a set changing membership, and
     there is no honest movement between "vs Mcap" and "vs Price". Every
     attempt to animate it read as decoration pretending to be continuity.
     So the row snaps, instantly, and the press is the only motion a button
     has. */
  :root{
    --t-chart: 420ms;
    --e-out:   cubic-bezier(.22, 1, .36, 1);
  }
  .btn{
    font-family:'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:clamp(10px, 0.92vw, 15px);
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:clamp(7px, 0.7vw, 13px) clamp(12px, 1.25vw, 24px);
    background:transparent;
    color:rgba(245,243,238,0.55);
    border:1px solid rgba(245,243,238,0.18);
    cursor:pointer;
    /* NO COLOUR TRANSITION. The highlight has to be the immediate answer to
       the press, and any fade at all -- even 100ms -- reads as arriving after
       the other things that changed in the same frame. transform stays: that
       is the press having weight, not a state change. */
    transition:transform 110ms ease;
    /* Comfortably tappable on a phone regardless of how the clamps land. */
    min-height:38px;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{ color:var(--gold); border-color:var(--gold); }
  .btn:active{ transform:scale(0.965); }
  .btn.active{ background:var(--gold); color:var(--black); border-color:var(--gold); }
  @media (prefers-reduced-motion: reduce){
    .btn{ transition:none; }
  }
  .btn[disabled]{ opacity:0.32; cursor:not-allowed; }
  .btn[disabled]:hover{ color:rgba(245,243,238,0.55); border-color:rgba(245,243,238,0.18); }

  /* ---------------------------------------------------------------- plot */
  .plot-wrap{
    flex:1 1 auto;
    position:relative;
    min-height:240px;
  }
  .plot{ width:100%; display:block; }
  /* none, not pan-y: pan-y still allows the browser to claim a two-finger
     gesture as a page zoom on iOS, which is why pinching did nothing at all.
     The cost is that the page cannot be scrolled by dragging ON the plot --
     acceptable, since one finger there is already the readout. */
  .plot-wrap{ touch-action:none; }
  .msg{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(11px, 1vw, 16px);
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(245,243,238,0.35);
    text-align:center;
    padding:0 20px;
  }
  .fade{ opacity:0; transition:opacity 220ms ease; }
  /* Transparent, on top, never rebuilt: every pointer lands here, so a redraw
     underneath cannot cancel a gesture in progress. */
  .hit{ position:absolute; inset:0; z-index:3; }
  .fade.in{ opacity:1; }

  .tip{
    position:absolute;
    transform:translate(-50%, -100%);
    background:var(--black);
    border:1px solid rgba(199,168,105,0.45);
    padding:clamp(7px, 0.7vw, 12px) clamp(9px, 0.9vw, 15px);
    pointer-events:none;
    opacity:0;
    transition:opacity 120ms ease;
    white-space:nowrap;
    z-index:4;
  }
  .tip-price{ font-size:clamp(13px, 1.25vw, 21px); color:var(--gold-light); }
  .tip-time{ font-size:clamp(9px, 0.8vw, 13px); color:rgba(245,243,238,0.42); margin-top:2px; letter-spacing:0.08em; }
  .tip-evt{
    display:none;
    margin-top:5px;
    padding-top:5px;
    border-top:1px solid rgba(199,168,105,0.25);
    font-size:clamp(9px, 0.82vw, 14px);
    line-height:1.5;
    color:var(--gold);
    letter-spacing:0.04em;
  }

  /* EVENT MARKS
     Three weights, no type. A stub on the baseline for the ordinary, a taller
     spike for the notable, and a full rule with a diamond for the few that
     changed the supply meaningfully. Burns are gold, locks and unlocks are
     pale -- one is permanent and the other is not, and that distinction is
     worth a colour rather than a word. */
  .evt-mark{ stroke:rgba(199,168,105,0.62); stroke-linecap:round; }
  .evt-mark.mint{ stroke:rgba(199,168,105,0.30); }
  .evt-mark.move{ stroke:rgba(245,243,238,0.42); }
  .evt-rule{ stroke:rgba(199,168,105,0.22); stroke-width:1; stroke-dasharray:2 4; }
  .evt-rule.move{ stroke:rgba(245,243,238,0.16); }
  .evt-node{ fill:rgba(199,168,105,0.85); }
  .evt-node.move{ fill:rgba(245,243,238,0.6); }

  /* ---------------------------------------------------------------- foot */
  .sel{
    min-height:clamp(18px, 1.6vw, 26px);
    font-size:clamp(10px, 0.95vw, 15px);
    letter-spacing:0.06em;
    color:rgba(245,243,238,0.5);
    opacity:0;
    transition:opacity 140ms ease;
  }
  .sel.on{ opacity:1; }
  .sel b{ font-weight:400; }
  .sel .up{ color:var(--listed); }
  .sel .down{ color:var(--down); }
  .sel .px{ color:var(--gold); }
  .sel .arrow{ color:rgba(199,168,105,0.45); }
  .sel .hint{ margin-left:12px; color:rgba(245,243,238,0.25); font-size:0.86em; }
  /* THE HEADLINE ROLLS, IT DOES NOT BLINK.
     The first attempt faded the number to nothing and back, which leaves an
     empty box for a fifth of a second -- read as the number vanishing rather
     than changing. A roll never has an empty state: the outgoing value leaves
     upward while the incoming one arrives from below, both on screen at once,
     so the eye follows a substitution instead of a disappearance. */
  .roll{ position:relative; display:inline-block; overflow:hidden; vertical-align:bottom; }
  .roll > .rv{
    display:block;
    transition:transform var(--t-chart) var(--e-out), opacity 220ms ease;
    will-change:transform, opacity;
  }
  /* The outgoing copy is taken out of flow so the box keeps the incoming
     value's size -- left in flow the container doubles in height for a third
     of a second and shoves the chart down, which is the jump this exists to
     remove. */
  .roll > .rv.leaving{
    position:absolute; left:0; top:0; right:0;
    transform:translateY(-0.9em); opacity:0; pointer-events:none;
  }
  .roll > .rv.entering{ transform:translateY(0.9em); opacity:0; }
  @media (prefers-reduced-motion: reduce){
    .roll > .rv{ transition:none; }
    .roll > .rv.entering{ transform:none; opacity:1; }
    .roll > .rv.leaving{ display:none; }
  }
  .note{
    font-size:clamp(9px, 0.82vw, 14px);
    line-height:1.6;
    letter-spacing:0.05em;
    color:rgba(245,243,238,0.34);
    /* Reserved at its tallest, three lines. The market cap view carries an
       extra line about the circulating basis; without a floor here the plot
       gained a line's height on the price view and lost it again on market
       cap, moving the chart every time the toggle was pressed. */
    /* Six lines. An overlay carries the basis, what the gap means, the legend
       and the two gesture hints; without the floor the footer walks up and
       down the page every time the comparison is toggled. */
    min-height:6.4em;
  }
  .foot{
    font-size:clamp(9px, 0.8vw, 13px);
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:rgba(245,243,238,0.28);
  }

  /* --------------------------------------------------------------- phone */
  @media (max-width: 700px){
    body{ display:block; min-height:100%; }
    .plot-wrap{ height:52vh; min-height:260px; }
    .group.right{ margin-left:0; }
    .controls{ gap:6px; }
    .btn{ flex:1 1 auto; padding:9px 8px; letter-spacing:0.08em; }
    .group{ flex:1 1 100%; }
    /* Three rows: four ranges, four modes, then events. The modes used to
       share a row with EVENTS, which worked at two modes and does not at
       four -- six buttons across a phone puts "GENESIS" in a 60px box and it
       wraps mid-word. Ranges and modes are now four equal buttons each, one
       above the other, and EVENTS runs full width beneath them. It is a
       different kind of control -- on and off rather than one of four -- so
       reading differently is correct rather than accidental. */
    .group.right{ flex:1 1 100%; }
    /* Compare is three buttons and EVENTS is one, so together they make a row
       of four equal buttons matching the two rows above rather than a third
       full-width bar. */
    #compare{ flex:3 1 0; }
    #eventsToggle{ flex:1 1 0; }
    .head{ gap:8px; }
  }
</style>
